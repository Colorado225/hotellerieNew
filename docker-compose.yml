name: lagoonkey

services:
  postgres:
    image: postgres:17-alpine
    container_name: lagoonkey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lagoonkey
      POSTGRES_PASSWORD: lagoonkey
      POSTGRES_DB: lagoonkey
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagoonkey -d lagoonkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lagoonkey-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for guest documents, invoice logos and generated PDFs.
  minio:
    image: minio/minio:latest
    container_name: lagoonkey-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lagoonkey
      MINIO_ROOT_PASSWORD: lagoonkey_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP sink. Webhooks point at http://localhost:1025 in development.
  mailpit:
    image: axllent/mailpit:latest
    container_name: lagoonkey-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data: